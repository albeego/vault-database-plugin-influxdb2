name: Gosec

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Declared explicitly to match the called workflow. gosec only needs
# contents: read, which the read-only org default already grants -- so unlike
# gitleaks it starts today either way. Stating it keeps that true if the
# default is tightened further.
permissions:
  contents: read

jobs:
  gosec:
    if: ${{ github.event.pull_request.draft == false }}
    uses: albeego/central-workflows/.github/workflows/gosec.yml@main
    with:
      # Not the shared default of 'stable'. That is the newest RELEASED Go,
      # which is not necessarily the one this module declares -- and a module
      # ahead of it cannot be analysed at all, which in device-portal-agent
      # produced "Files: 0  Issues: 0" alongside a red check. go.mod is the
      # single source of truth here, as it is in go-build-pr.yml.
      go-version-file: go.mod
