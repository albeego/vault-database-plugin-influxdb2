# Compile, test and vulnerability-scan the PR's merge result.
#
# This repository had no PR CI at all: release.yml runs only after a merge to
# main, so nothing compiled the code, ran influxdbv2_test.go or scanned it
# before it landed. This plugin is how Vault reaches InfluxDB, so a broken
# merge here is discovered by the secrets engine failing, not by a test.
#
# actions/checkout on pull_request checks out the merge commit, so this
# validates exactly what main would become.
name: Go build & test

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  go-build:
    name: go build / vet / test / govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge result
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Read the version from go.mod rather than pinning it here: two statements
      # of the same fact drift.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Reachability-based, so it reports what this code can actually call
      # rather than everything in go.sum, and it covers the Go standard library
      # as well as modules. That stdlib coverage is the point: a module pinned to
      # an old patch release carries every unfixed stdlib bug with it, and
      # nothing else in CI looks at that.
      #
      # Gated through a script rather than run bare, because govulncheck has no
      # ignore mechanism and exits non-zero on any finding. Two Moby findings are
      # unfixable from here -- see .govulncheck-allow. Anything not in that file
      # fails the build.
      - name: Vulnerability scan
        run: |
          # govulncheck must be built with a toolchain at least as new as the
          # module's, or it refuses the analysis. `go install pkg@latest`
          # resolves govulncheck's own go directive, not ours, so pin the
          # toolchain to the one setup-go installed for us.
          GOTOOLCHAIN="go$(go env GOVERSION | sed 's/^go//')" \
            go install golang.org/x/vuln/cmd/govulncheck@latest
          PATH="$(go env GOPATH)/bin:$PATH" ./scripts/govulncheck-gate.sh
